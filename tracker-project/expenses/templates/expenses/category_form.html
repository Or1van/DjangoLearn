{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Edit category" %}{% endblock %}
{% block content %}
<div class="card form-card fade-in">
  <h1>{% trans "Edit category" %}</h1>
  <form method="post" style="margin-top:1rem">
    {% csrf_token %}
    {% for field in form %}
      <div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn">{% trans "Save" %}</button>
      <a href="{% url 'expenses:category_list' %}" class="btn secondary">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
{% endblock %}
